name = "prms_magnet/testkit"
version = "0.1.0"
description = "Property-testing core for Luau: a symbolic-program differential fuzzer, a delta-debugging shrinker, a mutator and an oracle-necessity grader."
license = "MIT"
authors = ["prms-magnet"]
repository = "https://github.com/PRMS-magnet/testkit"
includes = [
    "pesde.toml",
    "README.md",
    "LICENSE",
    "src/**/*.luau",
]

[target]
environment = "luau"
lib = "src/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[engines]
pesde = "^0.7.0"
