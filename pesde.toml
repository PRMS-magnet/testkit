name = "prms_magnet/testkit"
version = "0.1.1"
description = "A property tester for Luau"
license = "MIT"
authors = ["prms-magnet"]
repository = "https://github.com/PRMS-magnet/testkit"
includes = [
    "pesde.toml",
    "README.md",
    "LICENSE",
    "src/**/*.luau",
]

[target]
environment = "luau"
lib = "src/init.luau"

[indices]
default = "https://github.com/pesde-pkg/index"

[engines]
pesde = "^0.7.0"
